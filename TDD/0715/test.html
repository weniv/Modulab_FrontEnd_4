<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        article {
            display: inline-block;
            border: 3px solid black;
            border-radius: 10px;
            padding: 15px;
        }

        .viewer {
            display: block;
            font-size: 24px;
            color: teal;
            text-align: center;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <article>
        <strong class="viewer"></strong>
        <input type="text" class="inp-txt">
        <button class="btn-push" onclick="push()">적용</button>
    </article>

    <script>
        let txt = 'hello modulab';
        const viewer = document.querySelector('.viewer');
        viewer.textContent = txt;

        function push() {
            const inpTxt = document.querySelector('.inp-txt');
            viewer.textContent = inpTxt.value;
        }

        // 테스트가 가능하려면
        // 1. 테스트 코드를 UI 에서 완전히 분리해야한다.
        // 2. 자바스크립트는 별도의 파일로 분리한다.
        // 3. 자바스크립트의 모든 기능은 함수로 구현한다.
    </script>
</body>

</html>
