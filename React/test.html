<!DOCTYPE html>
<html lang="ko">
<body>
<script>
    // 단락 평가
    // 단락 평가란, 논리 연산자 &&와 ||를 사용하여 조건에 따라 값을 선택하는 방법입니다.
    // 컴퓨터가 어디까지 봐야할지 보시면 됩니다.
    console.log(3 && 'hello')
    console.log(false && 'hello')
    console.log(true || 'hello')
    console.log('world' || 'hello')

    let username = null;
    username = username || 'guest';
    console.log(username); // 'guest'
</script>
</body>
</html>
