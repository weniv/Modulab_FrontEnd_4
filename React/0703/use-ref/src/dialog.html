<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="dialogBtn">나와라 모달</button>
    <dialog id="myDialog">
        <!-- <form method="dialog"> -->
        <h2>Dialog</h2>
        <p>This is HTML dialog</p>
        <button>OK!</button>

        <!-- </form> -->
    </dialog>

    <script>
        const dialog = document.querySelector('#myDialog');
        const dialogBtn = document.querySelector('#dialogBtn');
        const closeBtn = document.querySelector('#myDialog button');

        dialogBtn.addEventListener('click', () => {
            dialog.show();
        });

        closeBtn.addEventListener('click', () => {
            dialog.close();
        });

    </script>
</body>

</html>
