        let n = 6;
        const memory = new Array(n + 1).fill(0);
        // [0, 0, 0, 2, 3, 5, 8]
        function fnM(n) {
            if (n === 1 || n === 2) {
                return 1;
                // 처음 저장하는 값이 아니라면
            } else if (memory[n] !== 0) {
                return memory[n];
            }
            // 처음 저장하는 값이라면
            else {
                memory[n] = fnM(n - 1) + fnM(n - 2);
                return memory[n];
            }
        }

        console.log(fnM(6));

    </script>
